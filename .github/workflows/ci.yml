name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typprüfung
        run: uv run mypy
      - name: Tests
        run: uv run pytest
