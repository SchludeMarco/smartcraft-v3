name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typprüfung
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: requirements.txt passt zu uv.lock (Vercel)
        run: |
          uv export --no-dev --no-hashes --no-emit-project --quiet > /tmp/requirements.txt
          diff -u ../../requirements.txt /tmp/requirements.txt || {
            echo "::error::requirements.txt ist veraltet. Bitte in apps/api 'uv export --no-dev --no-hashes --no-emit-project > ../../requirements.txt' ausführen."
            exit 1
          }
      - name: API-Vertrag aktuell (openapi.json)
        run: |
          uv run python -m smartcraft_api.openapi_export ../web/openapi.json
          git diff --exit-code -- ../web/openapi.json || {
            echo "::error::apps/web/openapi.json ist veraltet. Bitte 'uv run python -m smartcraft_api.openapi_export ../web/openapi.json' und 'npm run gen:api' ausführen."
            exit 1
          }

  api-postgres:
    # Gleiche Tests gegen echtes Postgres (wie Neon im dauerhaften Betrieb, ADR 0013)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smartcraft_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --python 3.12
      - name: Tests gegen Postgres
        env:
          SMARTCRAFT_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/smartcraft_test
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generierte API-Typen aktuell
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts ist veraltet. Bitte 'npm run gen:api' ausführen."
            exit 1
          }
      - name: Lint
        run: npm run lint
      - name: Typprüfung
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --python 3.12
        working-directory: apps/api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Browser-Test des kompletten Ablaufs
        run: npm run e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
