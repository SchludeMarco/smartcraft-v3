name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typprüfung
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: requirements.txt passt zu uv.lock (Vercel)
        run: |
          uv export --no-dev --no-hashes --no-emit-project --quiet > /tmp/requirements.txt
          diff -u ../../requirements.txt /tmp/requirements.txt || {
            echo "::error::requirements.txt ist veraltet. Bitte in apps/api 'uv export --no-dev --no-hashes --no-emit-project > ../../requirements.txt' ausführen."
            exit 1
          }
      - name: API-Vertrag aktuell (openapi.json)
        run: |
          uv run python -m smartcraft_api.openapi_export ../web/openapi.json
          git diff --exit-code -- ../web/openapi.json || {
            echo "::error::apps/web/openapi.json ist veraltet. Bitte 'uv run python -m smartcraft_api.openapi_export ../web/openapi.json' und 'npm run gen:api' ausführen."
            exit 1
          }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generierte API-Typen aktuell
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts ist veraltet. Bitte 'npm run gen:api' ausführen."
            exit 1
          }
      - name: Lint
        run: npm run lint
      - name: Typprüfung
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
